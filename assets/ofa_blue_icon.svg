<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <!-- Deep Midnight Slate Background Gradient -->
    <linearGradient id="bgGrad" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#131F38"/>
      <stop offset="50%" stop-color="#0C1426"/>
      <stop offset="100%" stop-color="#070C17"/>
    </linearGradient>

    <!-- Subtle Ambient Cobalt Radial Glow (Android VectorDrawable compatible) -->
    <radialGradient id="ambientGlow" cx="50%" cy="54%" r="44%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#06B6D4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#080E1A" stop-opacity="0"/>
    </radialGradient>

    <!-- Headband Electric Cobalt -> Vibrant Cyan Gradient -->
    <linearGradient id="archGrad" x1="20%" y1="80%" x2="80%" y2="10%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Crisp White -> Ice Highlight for Earcups -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCEBFA"/>
    </linearGradient>

    <!-- Glowing Acoustic LED Accent on Earcups -->
    <linearGradient id="ledGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Dual Broadcast Wave Gradient -->
    <linearGradient id="waveInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="waveOuterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Central Broadcast Node Gradient -->
    <radialGradient id="coreGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </radialGradient>
  </defs>

  <!-- ==================== BACKGROUND LAYER (ic_launcher_background) ==================== -->
  <g id="background">
    <rect x="0" y="0" width="108" height="108" fill="url(#bgGrad)"/>
    <circle cx="54" cy="58" r="48" fill="url(#ambientGlow)"/>
    <!-- Subtle Acoustic Radar Rings -->
    <circle cx="54" cy="54" r="36" fill="none" stroke="#38BDF8" stroke-opacity="0.07" stroke-width="0.9"/>
    <circle cx="54" cy="54" r="46" fill="none" stroke="#3B82F6" stroke-opacity="0.05" stroke-width="0.9"/>
  </g>

  <!-- ==================== FOREGROUND LAYER (ic_launcher_foreground) ==================== -->
  <!-- Safely contained inside Android Adaptive Icon safe zone (center 66%: 18..90, r<=33) -->
  <g id="foreground">
    <!-- Headphone Arch -->
    <path
      d="M 33.0 58.0 A 21.0 21.0 0 0 1 75.0 58.0"
      fill="none"
      stroke="url(#archGrad)"
      stroke-width="4.8"
      stroke-linecap="round"/>

    <!-- Subtle Specular Top Crown Highlight on Headband -->
    <path
      d="M 41.2 41.4 A 21.0 21.0 0 0 1 66.8 41.4"
      fill="none"
      stroke="#F8FAFC"
      stroke-opacity="0.45"
      stroke-width="1.3"
      stroke-linecap="round"/>

    <!-- Left Earcup -->
    <rect x="29.0" y="54.5" width="8.4" height="19.0" rx="4.2" fill="url(#cupGrad)"/>
    <!-- Left Earcup Cyan LED Acoustic Strip -->
    <rect x="27.2" y="59.0" width="2.5" height="10.0" rx="1.25" fill="url(#ledGrad)"/>

    <!-- Right Earcup -->
    <rect x="70.6" y="54.5" width="8.4" height="19.0" rx="4.2" fill="url(#cupGrad)"/>
    <!-- Right Earcup Cyan LED Acoustic Strip -->
    <rect x="78.3" y="59.0" width="2.5" height="10.0" rx="1.25" fill="url(#ledGrad)"/>

    <!-- Central Broadcast Core Halo -->
    <circle cx="54.0" cy="64.0" r="7.2" fill="#38BDF8" fill-opacity="0.16"/>

    <!-- Dual-Link Broadcast Waves (Inner Pair) -->
    <path
      d="M 46.88 58.83 A 8.8 8.8 0 0 0 46.88 69.17"
      fill="none"
      stroke="url(#waveInnerGrad)"
      stroke-width="2.7"
      stroke-linecap="round"/>
    <path
      d="M 61.12 58.83 A 8.8 8.8 0 0 1 61.12 69.17"
      fill="none"
      stroke="url(#waveInnerGrad)"
      stroke-width="2.7"
      stroke-linecap="round"/>

    <!-- Dual-Link Broadcast Waves (Outer Pair) -->
    <path
      d="M 43.36 55.68 A 13.5 13.5 0 0 0 43.36 72.32"
      fill="none"
      stroke="url(#waveOuterGrad)"
      stroke-width="2.7"
      stroke-linecap="round"/>
    <path
      d="M 64.64 55.68 A 13.5 13.5 0 0 1 64.64 72.32"
      fill="none"
      stroke="url(#waveOuterGrad)"
      stroke-width="2.7"
      stroke-linecap="round"/>

    <!-- Central Broadcast Node -->
    <circle cx="54.0" cy="64.0" r="3.9" fill="url(#coreGrad)"/>
  </g>
</svg>
